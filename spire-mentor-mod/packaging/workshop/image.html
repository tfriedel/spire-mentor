<!doctype html>
<!-- Source of image.png, the Steam Workshop preview (render-image.ps1 renders
     it at 1024x1024). Original artwork only: no game art may go in here. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #1e1b2b;
    --bg2: #2a2540;
    --panel: #262136;
    --line: #3b3456;
    --gold: #e0b04c;
    --gold-dim: #8a6d33;
    --text: #f1ead8;
    --muted: #a59cb8;
    --good: #6fcf8a;
    --mid: #e0b04c;
    --bad: #d9665b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #3a2f5c 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, #2d2244 0%, transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: .18;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  header { position: absolute; top: 64px; left: 0; right: 0; text-align: center; }
  .mark {
    width: 54px; height: 54px; margin: 0 auto 22px;
    background: var(--gold); transform: rotate(45deg);
    box-shadow: 0 0 40px rgba(224,176,76,.55);
  }
  h1 {
    font-size: 104px; font-weight: 800; letter-spacing: 6px; line-height: 1;
    background: linear-gradient(180deg, #fff3cf 0%, var(--gold) 70%, #b8862e 100%);
    -webkit-background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 18px; font-size: 34px; font-weight: 500; color: var(--muted);
    letter-spacing: 1px;
  }
  .sub b { color: var(--text); font-weight: 600; }

  /* the hand: three original card shapes with advisor scores */
  .hand {
    position: absolute; top: 370px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 34px;
  }
  .card {
    width: 200px; height: 280px; border-radius: 18px; position: relative;
    background: linear-gradient(160deg, var(--bg2), var(--panel));
    border: 3px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .card:nth-child(1) { transform: rotate(-7deg) translateY(18px); }
  .card:nth-child(3) { transform: rotate(7deg) translateY(18px); }
  .card.best { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(224,176,76,.25), 0 0 60px rgba(224,176,76,.35), 0 18px 40px rgba(0,0,0,.45); transform: translateY(-14px); }
  .card .art {
    position: absolute; top: 22px; left: 22px; right: 22px; height: 116px;
    border-radius: 10px; display: grid; place-items: center;
    background: rgba(255,255,255,.04);
  }
  .card .art svg { width: 76px; height: 76px; }
  .card .lines { position: absolute; left: 26px; right: 26px; top: 160px; }
  .card .lines i { display: block; height: 12px; border-radius: 6px; background: var(--line); margin-bottom: 14px; }
  .card .lines i:nth-child(2) { width: 80%; }
  .card .lines i:nth-child(3) { width: 55%; }
  .score {
    position: absolute; top: -26px; right: -22px;
    width: 84px; height: 84px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 38px; font-weight: 800; color: #1e1b2b;
    box-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  .s-good { background: var(--good); }
  .s-mid  { background: var(--mid); }
  .s-bad  { background: var(--bad); }

  /* win chance */
  .win {
    position: absolute; left: 112px; right: 112px; top: 742px;
  }
  .win .label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 28px; color: var(--muted); margin-bottom: 14px;
  }
  .win .label b { font-size: 46px; color: var(--text); font-weight: 800; }
  .bar { height: 26px; border-radius: 13px; background: var(--panel); border: 2px solid var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 73%; border-radius: 13px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }

  footer {
    position: absolute; bottom: 58px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 22px;
  }
  .pill {
    font-size: 25px; font-weight: 600; padding: 10px 22px; border-radius: 30px;
    border: 2px solid var(--line); color: var(--muted); background: rgba(38,33,54,.8);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <header>
    <div class="mark"></div>
    <h1>SPIRE MENTOR</h1>
    <p class="sub">AI coach for <b>Slay the Spire 2</b></p>
  </header>

  <div class="hand">
    <div class="card">
      <div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="#a59cb8" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/></svg></div>
      <div class="lines"><i></i><i></i><i></i></div>
      <div class="score s-mid">64</div>
    </div>
    <div class="card best">
      <div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="#e0b04c" stroke-width="1.6" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/></svg></div>
      <div class="lines"><i></i><i></i><i></i></div>
      <div class="score s-good">92</div>
    </div>
    <div class="card">
      <div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="#a59cb8" stroke-width="1.6" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
      <div class="lines"><i></i><i></i><i></i></div>
      <div class="score s-bad">31</div>
    </div>
  </div>

  <div class="win">
    <div class="label"><span>Win chance</span><b>73%</b></div>
    <div class="bar"><span></span></div>
  </div>

  <footer>
    <span class="pill">Card scores</span>
    <span class="pill">Best moves</span>
    <span class="pill">Map routes</span>
    <span class="pill">Autoplay</span>
  </footer>
</body>
</html>
