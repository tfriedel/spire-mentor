[tool.ty.src]
# Existing code (scripts and tests) predates type checking and uses dict-shaped
# game state heavily. ty is installed and ready — opt new code in by adding
# its directory to `include` (or removing it from `exclude`).
exclude = [
  "python/**",
  "agent/**",
  "tests/**",
  "lib/**",
  "decompiled/**",
  "saves/**",
  "logs/**",
]
