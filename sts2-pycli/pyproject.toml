  "test_realgame_control",
  "champions",
  "floors",
  "sync_champions",
  "game_log",
  "ppo",
  "ppo_decode",
  "runtime_paths",
  "sts2_client",
  "sts2_combat",
  "sts2_format",
  "parity_audit",
  "parity_fuzz",
  "parity_fuzz_scenario",
  "parity_fuzz_state",
  "play",
  "replay",
  "simlab",
  "sts2_hint",
  "sweep_manifest",
  "trace_subject",
  "workbench",
  "synergy",
  "act1_replay",
  "boss_only",
  "play_full_run_rust",
  "run_arena",
  "run_files",
  "run_parity",
  "run_policy",
  "run_setup_parity",
  "run_stepper",
  "combat_mirror",
  "coop_coordination",
  "coop_replay",
  "diag_leaf_saturation",
  "encoder_combat_surrogate",
  "eval_combat_surrogate_net",
  "eval_run_value_net",
  "realgame_adapter",
  "realgame_advisor",
  "realgame_advisor_mirror",
  "realgame_bridge",
  "realgame_control",
  "realgame_eval",
  "realgame_hand_select",
  "realgame_livetree",
  "realgame_mcts",
  "realgame_ppo",
  "realgame_random",
  "realgame_workbench_log",
  "runstats",
  "shadow_replay",
  "sts2_realgame",
  "train_combat_surrogate_net",
  "train_combat_surrogate_transformer",
  "train_run_value_net",
  "train_value",
]
exclude = [
  "agent/.*",
  "tests/.*",
  "python/replay/tests/.*",
  "python/synergy/tests/.*",
  ".venv",
  "lib",
  "decompiled",
