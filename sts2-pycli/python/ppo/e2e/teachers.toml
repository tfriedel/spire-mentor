# The e2e campaign's pinned teacher pairs (GH #1097, plan D1, PREREG-0): what
# `ppo.e2e.teachers.load_pair(<name>)` loads, and the sha256 each file must have.
#
# Pinned ON PURPOSE: a champion promotion must not move a teacher. This is not a
# champion manifest (that is `data/ppo/champions.toml`); never resolve a teacher
# through it. A new pair is a new table here, or `load_pair(combat=..., run=...)`
# by paths.
#
# `root`: "archive" = ~/projects/sts2/bench-archive/2026-11-02-e2e-inputs (the
# frozen inputs; its SHA256SUMS records the same sha256), "h2h3" =
# ~/projects/sts2/bench-archive/2026-11-03-combat-ppo-h2-h3 (the final R3, copied
# read-only on the laptop and the a4000), "repo" = the monorepo root. `path` is relative to the root. Loading a file whose sha256 differs raises
# `teachers.TeacherMismatch`.

[R2.combat]  # #1081's R2 combat net, ~600.6M decisions
root = "archive"
path = "run/it06000.pt"
sha256 = "cc925b031cf2c137ffece4bbec4953ec689ea9bdf4ed5959123b9bcebd6e3c3a"

